name: Idea
description: Something v_Where could do, or do better.
labels: [enhancement]
body:
  - type: textarea
    id: goal
    attributes:
      label: What you're trying to do
      description: The report or question you had, not the feature. "I need a list of laptops whose battery..." beats "add a battery filter".
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
  - type: textarea
    id: else
    attributes:
      label: Anything else
